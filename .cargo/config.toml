# A pyo3 `extension-module` cdylib deliberately leaves CPython symbols undefined —
# they are resolved by the interpreter at import time, not at link time. macOS's
# linker treats that as an error unless told otherwise, so `cargo build` on the
# Python binding fails without these flags. Linux and Windows need no equivalent.
#
# maturin sets this up itself, so this file only matters for plain `cargo build`
# / `cargo clippy` over the workspace, which is what CI and `just lint` run.

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
