[advisories]
version = 2
yanked = "deny"
# Nothing ignored. RUSTSEC-2024-0436 (`paste` unmaintained) was listed here until
# parquet 59.2 stopped depending on it; cargo-deny then warned on every run that the
# entry matched no crate. An ignore that outlives its cause is worse than none: it is
# noise printed next to real findings, and this one sat immediately beside
# RUSTSEC-2026-0285 in the log that reported it.
ignore = []

[licenses]
version = 2
# Apache-2.0 for this project; permissive-only for dependencies so the Python,
# R, and npm distributions can all ship binaries without extra obligations.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Covers webpki-roots, the Mozilla CA certificate bundle reqwest uses for TLS.
    # A *data* licence rather than a code one, which is why it was not on this list
    # originally. Checked before adding: CDLA-Permissive-2.0 has no copyleft, no
    # share-alike, and no attribution-by-name requirement — the only obligation is
    # to carry the licence text with the data, exactly as MIT requires.
    "CDLA-Permissive-2.0",
    # Covers tiny-keccak, reached through ahash from the parquet/arrow stack. CC0-1.0 is
    # a public-domain dedication rather than a licence: it imposes no obligations at all,
    # so it is strictly more permissive than the MIT entry above. Worth recording that it
    # explicitly declines to grant patent rights (section 4a) — which some corporate
    # policies dislike — but MIT and ISC, already allowed here, grant none either, so
    # this adds no obligation the project was not already accepting.
    "CC0-1.0",
    # Covers borrow-or-share, reached through boon's URI parser when the
    # schema-validation feature is on. MIT-0 is MIT with the attribution clause
    # removed, so it is strictly more permissive than the MIT entry above and imposes
    # no obligation this project was not already accepting.
    "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# object_store's transport features (aws, azure, gcp, http) force aws-lc-rs, a C and
# assembly crypto library that cannot build for wasm32-unknown-unknown. Its `-base`
# variants do compile there, but omit the transport — so nothing usable survives the
# browser target today. Banned outright because a transitive pull would leave the native
# build green and break only the browser one; the ByteSource trait in iucn-rle-io is the
# supported extension point instead. See that crate's module docs for the full check,
# including the two open upstream WebAssembly issues.
# GEOS/GDAL/PROJ sys-crates are banned for the same reason: they are C/C++ and
# would end both the WASM binding and portable wheels.
deny = [
    { name = "object_store" },
    { name = "geos" },
    { name = "geos-sys" },
    { name = "gdal" },
    { name = "gdal-sys" },
    { name = "proj" },
    { name = "proj-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
