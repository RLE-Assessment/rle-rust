[package]
name = "iucn-rle-format"
description = "Synchronous decoders for IUCN Red List of Ecosystems data formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Everything here is SYNCHRONOUS and operates on in-memory bytes. That is the whole
# point: async lives only in iucn-rle-io, so the decoders carry no Send bounds and
# compile for wasm32 unchanged. Bytes arrive already fetched.
[dependencies]
iucn-rle-core = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# default-features = false drops the async reader, which brings tokio and would not
# build for wasm32. "arrow" turns column chunks into typed arrays.
#
# The compression codecs are chosen by what they are written in, not by taste. snap,
# brotli, flate2 and lz4 are pure Rust and reach the browser unchanged. zstd is the
# exception: it binds a C library, so it is added for native targets only, below.
parquet = { version = "59.2", default-features = false, features = [
    "arrow",
    "snap",
    "brotli",
    # The pure-Rust zlib backend (miniz_oxide). The alternative, flate2-zlib-rs, would
    # bring C in and end the browser build. The crate spells its feature "backened".
    "flate2-rust_backened",
    "lz4",
] }
arrow-array = "59.2"
arrow-schema = "59.2"

# Pure Rust, so it targets wasm32 unchanged. Chosen over async-tiff, which cannot
# target wasm32 at any feature combination: it pulls object_store and reqwest by
# default, and zstd-sys is unconditional rather than a feature.
tiff = "0.10.3"

# ZSTD is what real GeoParquet is actually written with — Colombia's national ecosystems
# map among them — so a reader without it is not much use off the test bench. It is also
# the one common codec that cannot reach the browser: the crate binds a C library, and
# its build fails for wasm32-unknown-unknown. Native gets it; the WASM build keeps every
# pure-Rust codec and reports an honest error on a ZSTD file rather than mis-decoding it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.parquet]
version = "59.2"
default-features = false
features = ["arrow", "snap", "brotli", "flate2-rust_backened", "lz4", "zstd"]

# Optional because it is not free: boon reaches getrandom through ahash, which needs a
# browser backend and a build-wide RUSTFLAGS cfg to compile for wasm32. Validation is a
# tooling concern rather than a reading concern, so the browser build should not pay for
# it. Off by default; the CLI and CI turn it on.
[dependencies.boon]
version = "0.6"
optional = true

[features]
default = []
schema-validation = ["dep:boon"]

[dev-dependencies]
serde_json = { workspace = true }
iucn-rle-core = { workspace = true }

[lints]
workspace = true
