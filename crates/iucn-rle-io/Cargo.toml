[package]
name = "iucn-rle-io"
description = "Byte-range readers for IUCN Red List of Ecosystems data sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The ONLY async in the project lives here. Everything above this crate parses
# synchronously over in-memory bytes, which is what keeps `Send` bounds out of the
# decoders and lets the whole stack target WebAssembly.
[dependencies]
async-trait = "0.1"
bytes = "1"
thiserror = { workspace = true }
# For `buffered()`, which issues several range requests at once on a current-thread
# runtime. Pure Rust and no executor of its own, so it reaches wasm32 unchanged — the
# concurrency here is I/O overlap, not threads.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# reqwest is the one HTTP client covering both native and the browser: on
# wasm32-unknown-unknown it dispatches through the Fetch API. object_store is
# deliberately absent — its cloud transports do not compile for wasm32, and
# deny.toml bans it outright so a transitive pull cannot reintroduce it.
[dependencies.reqwest]
version = "0.12"
default-features = false
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
optional = true

[features]
default = ["http"]
http = ["dep:reqwest"]

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
# The HTTP tests drive a real socket, and reqwest's native transport needs a reactor.
# Only the tests need it; the library stays runtime-free so it can target wasm32.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
