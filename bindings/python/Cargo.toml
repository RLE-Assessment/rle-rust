[package]
name = "iucn-rle-python"
description = "Python bindings for IUCN Red List of Ecosystems assessment calculations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_iucn_rle"
crate-type = ["cdylib"]

[dependencies]
iucn-rle-core = { workspace = true }
serde_json = { workspace = true }
# abi3-py311 builds ONE wheel per platform instead of one per Python version,
# cutting the release matrix from ~25 wheels to ~5. rle-python already requires
# >=3.11, so this costs nothing.
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }

[lints]
workspace = true
